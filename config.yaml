name: GPT Live Bridge
version: "1.0.1"
slug: gpt_live_bridge
description: Native GPT Live 1 via Vercel AI Gateway — Full-Duplex Bridge
url: https://github.com/grosserknallkopf/ha-gpt-live-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
options:
  vercel_api_key: ""
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  bridge_port: 8090
  log_level: info
  model: "openai/gpt-live-1"
  voice: verse
  instructions: "You are a helpful Home Assistant voice assistant."
  delegation_model: "openai/gpt-5.6-sol"
  enable_aec: true
  noise_suppression_level: 3
  allowed_ha_domains:
    - light
    - switch
    - climate
    - media_player
    - cover
    - scene
    - script
schema:
  vercel_api_key: password
  ha_url: str
  ha_token: password
  bridge_port: port
  log_level: list(info|warning|error|debug)
  model: str
  voice: list(ash|ballad|chorus|coral|echo|onyx|verse|sage|shimmer|alloy)
  instructions: str
  delegation_model: str
  enable_aec: bool
  noise_suppression_level: int(1,5)
  allowed_ha_domains:
    - light
    - switch
    - climate
    - media_player
    - cover
    - scene
    - script
