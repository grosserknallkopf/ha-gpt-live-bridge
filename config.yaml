name: GPT Live Bridge
version: "1.0.1"
slug: gpt_live_bridge
description: Full-duplex GPT Live 1 bridge for ESP32-S3 voice assistants via Vercel AI Gateway
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
host_network: true
ports:
  8090/tcp: 8090
map:
  - homeassistant_config:rw
options:
  vercel_api_key: ""
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  voice: "verse"
  bridge_port: 8090
  log_level: "info"
  model: "openai/gpt-live-1"
  instructions: "You are a helpful Home Assistant voice assistant."
  delegation_model: "openai/gpt-4o-mini"
  allowed_ha_domains: "light,switch,climate,media_player,scene"
  enable_aec: true
  noise_suppression_level: 3
schema:
  vercel_api_key: password
  ha_url: str
  ha_token: password
  voice: str
  bridge_port: port
  log_level: list(info|debug|warning|error)
  model: str
  instructions: str
  delegation_model: str
  allowed_ha_domains: str
  enable_aec: bool
  noise_suppression_level: int(1,5)
