name: GPT Live Bridge
version: 1.0.0
slug: gpt_live_bridge
description: "Full-duplex GPT Live 1 bridge for ESP32-S3 voice assistants. Connects raw PCM audio from ESP32 to Vercel AI Gateway (openai/gpt-live-1). Supports Home Assistant MCP tools for device control."
stage: experimental
arch:
  - amd64
  - aarch64
  - armv7
host_network: true
hassio_api: true
homeassistant_api: true
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: "WebSocket server for ESP32 PCM audio streaming"
options:
  vercel_api_key: ""
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  voice: "verse"
  bridge_port: 8090
  log_level: "info"
schema:
  vercel_api_key:
    - str
  ha_url:
    - str
  ha_token:
    - str
  voice:
    - select
    - - alloy
      - echo
      - fable
      - onyx
      - nova
      - shimmer
      - verse
      - ash
      - ballad
      - coral
      - sage
  bridge_port:
    - int
    - min: 1024
      max: 65535
  log_level:
    - select
    - - debug
      - info
      - warn
      - error
startup: application
boot: auto
