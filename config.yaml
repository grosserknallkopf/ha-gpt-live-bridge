name: GPT Live Bridge
version: "1.0.4"
slug: gpt_live_bridge
description: GPT Live bridge for ESP32-S3 Jarvis via Vercel AI Gateway
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: default
host_network: false
ports:
  8090/tcp: 8090
options:
  vercel_api_key: ""
  ha_url: http://homeassistant.local:8123
  ha_token: ""
  voice: verse
  bridge_port: 8090
  log_level: info
  model: openai/gpt-live-1
  instructions: You are a helpful Home Assistant voice assistant.
schema:
  vercel_api_key: password
  ha_url: str
  ha_token: password
  voice: str
  bridge_port: port
  log_level: list(info|debug|warning|error)
  model: str
  instructions: str
