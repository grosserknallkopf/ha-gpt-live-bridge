name: GPT Live Bridge
version: "1.0.1"
slug: gpt_live_bridge
description: GPT Live voice bridge for ESPHome and Home Assistant
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: ESP32 WebSocket server
options:
  vercel_api_key: ""
  ha_url: http://homeassistant.local:8123
  ha_token: ""
  voice: alloy
  websocket_port: 8090
  model: openai/gpt-live-1
  instructions: You are a helpful Home Assistant voice assistant.
  delegation_model: openai/gpt-4o-mini
  enable_aec: true
  noise_suppression_level: 3
  allowed_ha_domains: light,switch,climate,media_player,scene
schema:
  vercel_api_key: password
  ha_url: str
  ha_token: password
  voice: list(alloy|ash|ballad|coral|echo|sage|shimmer|verse|marin|cedar)
  websocket_port: port
  model: str
  instructions: str
  delegation_model: str
  enable_aec: bool
  noise_suppression_level: int(1,5)
  allowed_ha_domains: str
