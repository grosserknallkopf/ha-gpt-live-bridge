name: GPT Live Bridge
version: "1.0.3"
slug: gpt_live_bridge
description: Native GPT Live 1 via Vercel AI Gateway - Full-Duplex Bridge for ESP32-S3 voice assistants
url: https://github.com/grosserknallkopf/ha-gpt-live-bridge
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
host_network: true
uart: false
options:
  vercel_api_key: ""
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  voice: verse
  bridge_port: 8090
  log_level: info
  model: openai/gpt-live-1
  instructions: You are a helpful Home Assistant voice assistant.
  delegation_model: ""
  allowed_ha_domains: light,switch,climate,media_player,scene
  enable_aec: true
  noise_suppression_level: 3
schema:
  vercel_api_key: password
  ha_url: str
  ha_token: password
  voice: str
  bridge_port: port
  log_level: list(info|debug|warning|error)
  model: str
  instructions: str
  delegation_model: str
  allowed_ha_domains: str
  enable_aec: bool
  noise_suppression_level: int(1,5)
