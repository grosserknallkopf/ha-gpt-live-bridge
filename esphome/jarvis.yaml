substitutions:
  device_name: jarvis
  friendly_name: Jarvis

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: 5.1.5
    platform_version: 6.5.0
  variant: esp32s3
  flash_size: 16MB
  psram:
    mode: octal
    speed: 80MHz

external_components:
  - source: github://grosserknallkopf/ha-gpt-live-bridge@main
    components: [gpt_live_client]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "Jarvis Fallback"
    password: !secret ap_password

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO47
    i2s_bclk_pin: GPIO48
  - id: i2s_out
    i2s_lrclk_pin: GPIO42
    i2s_bclk_pin: GPIO45

microphone:
  - platform: i2s_audio
    id: mic_input
    i2s_din_pin: GPIO21
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
  - platform: i2s_audio
    id: aec_reference
    i2s_din_pin: GPIO21
    adc_type: external
    pdm: false
    channel: right
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: speaker_output
    i2s_dout_pin: GPIO14
    dac_type: external

micro_wake_word:
  model: hey_jarvis
  on_wake_word_detected:
    - logger.log: "🔊 Wake Word: Hey Jarvis"
    - micro_wake_word.stop
    - gpt_live.connect
    - light.turn_on:
        id: status_led
        blue: 100%
        green: 100%
        brightness: 80%

gpt_live_client:
  id: gpt_live
  bridge_url: "ws://homeassistant.local:8090"
  microphone: mic_input
  speaker: speaker_output
  aec_reference: aec_reference
  chunk_size_ms: 20
  send_buffer_size: 4096
  recv_buffer_size: 16384
  on_connected:
    then:
      - logger.log: "✅ GPT-Live Session aktiv"
      - light.turn_on:
          id: status_led
          blue: 100%
          green: 0%
          brightness: 50%
  on_disconnected:
    then:
      - logger.log: "🔌 GPT-Live getrennt"
      - micro_wake_word.start
      - light.turn_on:
          id: status_led
          green: 30%
          blue: 0%
          red: 0%
          brightness: 30%
  on_transcript:
    then:
      - logger.log:
          format: "[%s] %s"
          args: [role, text]
  on_error:
    then:
      - logger.log:
          format: "⚠️ GPT-Live Fehler: %d"
          args: [code]
      - micro_wake_word.start

# Fallback: Classic HA Voice Pipeline
voice_assistant:
  id: va_fallback
  microphone: mic_input
  speaker: speaker_output
  noise_suppression_level: 3
  auto_gain: 31dBFS
  on_start:
    - light.turn_on:
        id: status_led
        blue: 50%
        green: 50%
        brightness: 70%
  on_end:
    - light.turn_on:
        id: status_led
        green: 30%
        blue: 0%
        red: 0%
        brightness: 30%
  on_error:
    - logger.log: "⚠️ Voice Assistant Fehler"
    - micro_wake_word.start

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO38
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 200ms

display:
  - platform: st7789v
    id: lcd_display
    model: Custom
    height: 240
    width: 280
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO3
    backlight_pin: GPIO2
    rotation: 0
    update_interval: never

switch:
  - platform: template
    id: mute_switch
    name: "Mute"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - gpt_live.disconnect
      - micro_wake_word.stop
      - light.turn_on:
          id: status_led
          red: 100%
          brightness: 30%
    on_turn_off:
      - micro_wake_word.start
      - light.turn_on:
          id: status_led
          green: 30%
          red: 0%
          brightness: 30%

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "BOOT Button"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(gpt_live).is_connected();'
            then:
              - gpt_live.disconnect
            else:
              - gpt_live.connect

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 11db
    filters:
      - multiply: 2.0
