substitutions:
  device_name: jarvis
  friendly_name: Jarvis

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: 5.1.5
    platform_version: 6.5.0
  variant: esp32s3
  flash_size: 16MB
  psram:
    mode: octal
    speed: 80MHz

external_components:
  - source: github://grosserknallkopf/ha-gpt-live-bridge@main
    components: [gpt_live_client]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
logger:
  level: INFO
  baud_rate: 0
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO47
    i2s_bclk_pin: GPIO48
  - id: i2s_out
    i2s_lrclk_pin: GPIO42
    i2s_bclk_pin: GPIO45
microphone:
  - platform: i2s_audio
    id: mic_input
    i2s_din_pin: GPIO21
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
speaker:
  - platform: i2s_audio
    id: speaker_output
    i2s_dout_pin: GPIO14
    dac_type: external
gpt_live_client:
  id: gpt_live
  bridge_url: ws://homeassistant.local:8090
  microphone: mic_input
  speaker: speaker_output
  chunk_size_ms: 20
  send_buffer_size: 4096
  recv_buffer_size: 16384
